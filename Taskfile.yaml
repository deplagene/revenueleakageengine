version: "3"

vars:
  GO_VERSION: "1.26.2"
  GOLANGCI_LINT_VERSION: "v2.10.1"
  GCI_VERSION: "v0.13.7"
  GOFUMPT_VERSION: "v0.9.2"
  SQLC_VERSION: "v1.31.1"
  SWAG_VERSION: "v1.16.4"
  TEMPL_VERSION: "v0.3.1001"
  HTMX_VERSION: "2.0.7"
  GOOSE_VERSION: "v3.27.0"
  BUF_VERSION: "v1.68.4"
  PROTOC_GEN_GO_VERSION: "v1.36.11"
  PROTOC_GEN_GO_GRPC_VERSION: "v1.6.1"

  DB_PATH: "./local.db"

  DOCKER_COMPOSE: "docker compose"

  BIN_DIR: "{{.ROOT_DIR}}/bin"
  GOLANGCI_LINT: "{{.BIN_DIR}}/golangci-lint"
  GCI: "{{.BIN_DIR}}/gci"
  GOFUMPT: "{{.BIN_DIR}}/gofumpt"
  SQLC: "{{.BIN_DIR}}/sqlc"
  SWAG: "{{.BIN_DIR}}/swag"
  TEMPL: "{{.BIN_DIR}}/templ"
  GOOSE: "{{.BIN_DIR}}/goose"
  BUF: "{{.BIN_DIR}}/buf"
  PROTOC_GEN_GO: "{{.BIN_DIR}}/protoc-gen-go"
  PROTOC_GEN_GO_GRPC: "{{.BIN_DIR}}/protoc-gen-go-grpc"
  HTMX: "{{.ROOT_DIR}}/internal/app/gateway/http/static/htmx.min.js"

tasks:
  install-formatters:
    desc: "Устанавливает форматтеры gci и gofumpt в ./bin"
    cmds:
      - |
        [ -f {{.GOFUMPT}} ] || {
          echo '📦 Устанавливаем gofumpt {{.GOFUMPT_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
        [ -f {{.GCI}} ] || {
          echo '📦 Устанавливаем gci {{.GCI_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: "Форматирует весь проект gofumpt + gci"
    deps: [install-formatters, install-templ]
    cmds:
      - |
        echo "🧩 Форматируем templ ..."
        {{.TEMPL}} fmt .
      - |
        echo "🧼 Форматируем через gofumpt ..."
        find . -type f -name '*.go' ! -path '*/mocks/*' ! -path './internal/gen/proto/*' -exec {{.GOFUMPT}} -extra -w {} +
      - |
        echo "🎯 Сортируем импорты через gci ..."
        find . -type f -name '*.go' ! -path '*/mocks/*' ! -path './internal/gen/proto/*' -exec {{.GCI}} write -s standard -s default {} +

  install-golangci-lint:
    desc: "Устанавливает golangci-lint в каталог bin"
    cmds:
      - |
        [ -f {{.GOLANGCI_LINT}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Устанавливаем golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: "Запускает golangci-lint для всех модулей"
    deps: [install-golangci-lint]
    cmds:
      - |
        mkdir -p .cache/go-build .cache/golangci-lint
        GOCACHE={{.ROOT_DIR}}/.cache/go-build \
        GOLANGCI_LINT_CACHE={{.ROOT_DIR}}/.cache/golangci-lint \
        {{.GOLANGCI_LINT}} run ./cmd/... ./internal/... --config=.golangci.yaml

  install-sqlc:
    desc: "Устанавливает sqlc в каталог bin"
    cmds:
      - |
        [ -f {{.SQLC}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Устанавливаем sqlc {{.SQLC_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}}
        }
    status:
      - test -x {{.SQLC}}

  sqlc-generate:
    desc: "Генерирует Go-код из SQL-запросов через sqlc"
    deps: [install-sqlc]
    cmds:
      - "{{.SQLC}} generate"

  sqlc-vet:
    desc: "Проверяет SQL-запросы и конфиг sqlc"
    deps: [install-sqlc]
    cmds:
      - echo "🔍 Проверяем sqlc..."
      - "{{.SQLC}} vet"
      - echo "✅ sqlc vet passed"

  install-swag:
    desc: "Устанавливает swag в каталог bin"
    cmds:
      - |
        [ -f {{.SWAG}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Устанавливаем swag {{.SWAG_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/swaggo/swag/cmd/swag@{{.SWAG_VERSION}}
        }
    status:
      - test -x {{.SWAG}}

  swagger-generate:
    desc: "Генерирует docs.go, swagger.json и swagger.yaml из аннотаций"
    deps: [install-swag]
    cmds:
      - "{{.SWAG}} init -g cmd/revenueleakageengine/main.go -o docs --parseInternal"

  install-goose:
    desc: "Устанавливает goose в каталог bin"
    cmds:
      - |
        [ -f {{.GOOSE}} ] || {
          mkdir -p {{.BIN_DIR}} .cache/go-build
          echo "📦 Устанавливаем goose {{.GOOSE_VERSION}}..."
          GOCACHE={{.ROOT_DIR}}/.cache/go-build GOBIN={{.BIN_DIR}} go install github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}}
        }
    status:
      - test -x {{.GOOSE}}

  install-buf:
    desc: "Устанавливает buf в каталог bin"
    cmds:
      - |
        expected="{{.BUF_VERSION}}"
        expected="${expected#v}"
        [ -x {{.BUF}} ] && [ "$({{.BUF}} --version)" = "$expected" ] || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Устанавливаем buf {{.BUF_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}}
        }
    status:
      - |
        expected="{{.BUF_VERSION}}"
        expected="${expected#v}"
        test -x {{.BUF}} && [ "$({{.BUF}} --version)" = "$expected" ]

  proto:install-plugins:
    desc: "Устанавливает protoc плагины в каталог bin"
    cmds:
      - |
        [ -x {{.PROTOC_GEN_GO}} ] && {{.PROTOC_GEN_GO}} --version | grep -q " {{.PROTOC_GEN_GO_VERSION}}$" || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Устанавливаем protoc-gen-go {{.PROTOC_GEN_GO_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
        }
        expected_grpc="{{.PROTOC_GEN_GO_GRPC_VERSION}}"
        expected_grpc="${expected_grpc#v}"
        [ -x {{.PROTOC_GEN_GO_GRPC}} ] && {{.PROTOC_GEN_GO_GRPC}} --version | grep -q " $expected_grpc$" || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Устанавливаем protoc-gen-go-grpc {{.PROTOC_GEN_GO_GRPC_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@{{.PROTOC_GEN_GO_GRPC_VERSION}}
        }
    status:
      - test -x {{.PROTOC_GEN_GO}} && {{.PROTOC_GEN_GO}} --version | grep -q " {{.PROTOC_GEN_GO_VERSION}}$"
      - |
        expected_grpc="{{.PROTOC_GEN_GO_GRPC_VERSION}}"
        expected_grpc="${expected_grpc#v}"
        test -x {{.PROTOC_GEN_GO_GRPC}} && {{.PROTOC_GEN_GO_GRPC}} --version | grep -q " $expected_grpc$"

  proto:lint:
    desc: "Проверяет .proto-файлы через buf"
    deps: [install-buf, proto:install-plugins]
    dir: proto
    cmds:
      - "{{.BUF}} lint"

  proto:gen:
    desc: "Генерирует Go-код из .proto"
    deps: [proto:lint]
    dir: proto
    cmds:
      - "PATH={{.BIN_DIR}}:$PATH {{.BUF}} generate"

  install-templ:
    desc: "Устанавливает templ CLI в каталог bin"
    cmds:
      - |
        [ -f {{.TEMPL}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Устанавливаем templ {{.TEMPL_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/a-h/templ/cmd/templ@{{.TEMPL_VERSION}}
        }
    status:
      - test -x {{.TEMPL}}

  install-htmx:
    desc: "Скачивает локальный htmx asset для server-rendered UI"
    cmds:
      - |
        [ -f {{.HTMX}} ] || {
          mkdir -p {{.ROOT_DIR}}/internal/app/gateway/http/static
          echo "📦 Скачиваем htmx {{.HTMX_VERSION}}..."
          curl -fsSL https://unpkg.com/htmx.org@{{.HTMX_VERSION}}/dist/htmx.min.js -o {{.HTMX}}
        }
    status:
      - test -s {{.HTMX}}

  ui-deps:
    desc: "Устанавливает зависимости Sprint 5 UI: templ runtime, templ CLI и htmx asset"
    deps: [install-templ, install-htmx]
    cmds:
      - |
        mkdir -p .cache/go-build
        GOCACHE={{.ROOT_DIR}}/.cache/go-build go get github.com/a-h/templ@{{.TEMPL_VERSION}}
      - |
        mkdir -p .cache/go-build
        GOCACHE={{.ROOT_DIR}}/.cache/go-build go mod tidy

  go-mod-tidy:
    desc: "Синхронизирует go.mod и go.sum"
    cmds:
      - |
        mkdir -p .cache/go-build
        GOCACHE={{.ROOT_DIR}}/.cache/go-build go mod tidy

  templ-generate:
    desc: "Генерирует Go-код из .templ компонентов"
    deps: [install-templ]
    cmds:
      - "{{.TEMPL}} generate -include-timestamp=false -include-version=false"

  templ-watch:
    desc: "Запускает templ watch с proxy/live reload для локального UI"
    deps: [install-templ]
    cmds:
      - "{{.TEMPL}} generate -watch -include-timestamp=false -include-version=false -proxy=http://localhost:8080 -proxyport=8081 -open-browser=false -cmd='task run'"

  test:
    desc: "Запускает go test для всего проекта"
    deps: [templ-generate]
    cmds:
      - |
        mkdir -p .cache/go-build
        GOCACHE={{.ROOT_DIR}}/.cache/go-build go test ./...

  test-integration:
    desc: "Запускает интеграционный Sprint 4 smoke-test"
    cmds:
      - |
        mkdir -p .cache/go-build
        GOCACHE={{.ROOT_DIR}}/.cache/go-build \
        go test -tags=integration ./internal/app/gateway/http \
          -run TestSprint4SmokeDatabaseDrivenReconciliation \
          -count=1

  test-kafka:
    desc: "Запускает unit-тесты Kafka/outbox/event pipeline"
    cmds:
      - |
        mkdir -p .cache/go-build
        GOCACHE={{.ROOT_DIR}}/.cache/go-build go test \
          ./internal/app/event \
          ./internal/app/outbox \
          ./internal/app/gateway/kafka \
          ./internal/platform/kafka/...

  test-coverage:
    desc: "Запускает go test с покрытием и сохраняет профиль"
    deps: [templ-generate]
    cmds:
      - |
        mkdir -p .cache/go-build .cache/coverage
        GOCACHE={{.ROOT_DIR}}/.cache/go-build go test ./... -coverprofile=.cache/coverage/coverage.out

  build:
    desc: "Собирает все Go пакеты проекта"
    deps: [templ-generate]
    cmds:
      - |
        mkdir -p .cache/go-build
        GOCACHE={{.ROOT_DIR}}/.cache/go-build go build ./...

  run:
    desc: "Запускает HTTP API локально"
    cmds:
      - |
        mkdir -p .cache/go-build
        GOCACHE={{.ROOT_DIR}}/.cache/go-build go run ./cmd/revenueleakageengine

  migrate-up:
    desc: "Применяет SQLite миграции к локальной базе"
    deps: [install-goose]
    cmds:
      - "{{.GOOSE}} -dir internal/platform/sqlite/migrations sqlite3 {{.DB_PATH}} up"

  compose:config:
    desc: "Проверяет итоговую конфигурацию docker-compose.yaml"
    cmds:
      - "{{.DOCKER_COMPOSE}} config"

  compose:build:
    desc: "Собирает Docker image сервиса"
    deps: [templ-generate]
    cmds:
      - "{{.DOCKER_COMPOSE}} build revenueleakageengine"

  compose:up:
    desc: "Запускает сервис, Kafka и Kafka UI через Docker Compose"
    deps: [templ-generate]
    cmds:
      - "{{.DOCKER_COMPOSE}} up --build"

  compose:up-detached:
    desc: "Запускает сервис, Kafka и Kafka UI в фоне"
    deps: [templ-generate]
    cmds:
      - "{{.DOCKER_COMPOSE}} up -d --build"

  compose:down:
    desc: "Останавливает Docker Compose стек"
    cmds:
      - "{{.DOCKER_COMPOSE}} down"

  compose:logs:
    desc: "Показывает логи Docker Compose стека"
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f"

  compose:up-infisical:
    desc: "Запускает Docker Compose через Infisical CLI с секретами из выбранного окружения"
    deps: [templ-generate]
    cmds:
      - |
        if [ -n "${INFISICAL_PROJECT_ID:-}" ]; then
          infisical run --env="${INFISICAL_ENV:-dev}" --projectId="${INFISICAL_PROJECT_ID}" -- {{.DOCKER_COMPOSE}} up --build
        else
          infisical run --env="${INFISICAL_ENV:-dev}" -- {{.DOCKER_COMPOSE}} up --build
        fi
